name: Desktop (Mac / Windows / Linux)

# Testes a cada alteração do desktop ou do spec/.
# Instaladores só nas "portas" (tag desktop-vX.Y) ou à mão (Run workflow).
on:
  push:
    branches: [main]
    paths: ["desktop/**", "spec/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - name: Leitores do desktop contra spec/
        run: npm test

  build:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --arm64 --x64 -c.mac.identity=-
          - os: windows-latest
            args: --win nsis --x64
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # sem certificados: Mac assinado ad-hoc, Windows sem assinatura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sintonia-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
